<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --line: #e2e2e7;
      --text: #1c1c1e;
      --muted: #6b6b70;
      --accent: #1a73e8;
      --danger: #c5221f;
      --pick: #e8f0fe;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    /* Android Chrome inflates page text by the phone's accessibility text
       scaling, which overrides the sizes below. This pins it to what the CSS
       actually says. */
    html {
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      /* dvh follows the address bar as it hides, so the pinned bar and the +
         button do not drift up and down while the list is scrolled. */
      height: 100dvh;
      overflow: hidden;
    }

    /* ---------------------------------------------------------- top bar */

    header {
      flex: 0 0 auto;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 7px 8px 0;
      z-index: 5;
    }

    .title { font-size: 14px; font-weight: 600; margin-bottom: 5px; }

    .views { display: flex; gap: 4px; margin-bottom: 6px; }
    .view {
      flex: 1;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
    }
    .view.on { background: var(--text); border-color: var(--text); color: #fff; }

    textarea {
      width: 100%;
      margin-top: 4px;
      padding: 10px;
      font: inherit;
      font-size: 16px;
      min-height: 66px;
      border: 1px solid var(--line);
      border-radius: 9px;
      resize: vertical;
    }
    .pair { display: flex; gap: 8px; }
    .pair > label { flex: 1; }
    .hide { display: none; }

    .months {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .months::-webkit-scrollbar { display: none; }

    .month {
      flex: 0 0 auto;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .month.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    /* ---------------------------------------------------------- list */

    main { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 6px 6px 84px; }

    /* table-layout:fixed with percentage columns is what keeps the whole grid
       inside the screen: cells clip instead of pushing the table wider. */
    .grid {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .grid th, .grid td {
      padding: 5px 2px;
      font-size: 10px;
      line-height: 1.2;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-bottom: 1px solid var(--line);
    }

    .grid th {
      background: var(--bg);
      color: var(--muted);
      font-weight: 700;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .grid td.mid, .grid th.mid { text-align: center; }
    .grid td.num, .grid th.num { text-align: right; padding-right: 4px; }
    .grid td.num { font-variant-numeric: tabular-nums; }
    .grid td.payee { font-weight: 600; padding-left: 4px; }

    .grid td.act { padding: 0; text-align: center; white-space: nowrap; }

    .rowbtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .rowbtn:active { background: var(--line); }
    .rowbtn.del { color: var(--danger); }

    .grid tbody tr.busy td { opacity: .45; }

    /* Cancelled, rebooked, and settled in full. */
    .grid tbody tr.cancelled td { background: #ffe2e2; }
    .grid tbody tr.rebooked td { background: #fff5c8; }
    .grid tbody tr.paid td { background: #d9eaff; }
    .grid tbody tr:last-child td { border-bottom: 0; }

    .grid tfoot td {
      font-weight: 700;
      font-size: 11px;
      background: var(--bg);
      border-top: 2px solid var(--line);
      border-bottom: 0;
    }

    .empty { text-align: center; color: var(--muted); padding: 48px 16px; }

    /* ---------------------------------------------------------- buttons */

    .fab {
      position: fixed;
      right: 14px;
      /* Sits above the home-indicator strip on gesture-nav phones. */
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 0;
      background: var(--accent);
      color: #fff;
      font-size: 26px;
      line-height: 1;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .25);
      z-index: 15;
      cursor: pointer;
    }

    button, .btn {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    button:disabled { opacity: .45; }

    /* ---------------------------------------------------------- form */

    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .4);
      display: none;
      align-items: flex-end;
      z-index: 20;
    }
    .scrim.on { display: flex; }

    .sheet {
      background: var(--card);
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 16px 16px 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    }
    @media (min-width: 640px) {
      .scrim { align-items: center; justify-content: center; }
      .sheet { max-width: 480px; border-radius: 14px; }
    }

    .sheet h2 { margin: 0 0 14px; font-size: 17px; }
    label { display: block; margin-bottom: 12px; font-size: 13px; color: var(--muted); }

    input, select {
      width: 100%;
      margin-top: 4px;
      padding: 12px;
      font-size: 16px;              /* 16px stops iOS zooming on focus */
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
    }
    input[inputmode="decimal"] { text-align: right; font-variant-numeric: tabular-nums; }

    .sheet .buttons { display: flex; gap: 8px; margin-top: 4px; }
    .sheet .buttons button { flex: 1; }

    /* ---------------------------------------------------------- lock */

    .lock {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 40;
    }
    .lock.off { display: none; }

    .lock form { width: 100%; max-width: 300px; text-align: center; }
    .lock .mark { width: 140px; height: 140px; object-fit: contain; margin-bottom: 10px; }
    .lock h1 { font-size: 20px; margin: 0 0 4px; }
    .lock p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
    .lock input { text-align: center; letter-spacing: 4px; font-size: 20px; margin-bottom: 12px; }
    .lock button { width: 100%; }
    .lockError { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 10px; }

    /* ---------------------------------------------------------- status */

    .status {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 78px;
      padding: 11px 14px;
      border-radius: 9px;
      background: #323236;
      color: #fff;
      font-size: 14px;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
      z-index: 30;
    }
    .status.on { opacity: 1; }
    .status.bad { background: var(--danger); }

    .busy { color: var(--muted); font-size: 13px; padding: 4px 0 8px; display: none; }
    .busy.on { display: block; }
  </style>
</head>

<body>
  <header>
    <div class="title" id="title">Balai Haraya</div>
    <div class="views">
      <button class="view on" id="viewDisb">Disbursement</button>
      <button class="view" id="viewBook">Bookings</button>
    </div>
    <div class="months" id="months"></div>
  </header>

  <main>
    <div class="busy" id="busy">Working...</div>
    <div id="list"></div>
  </main>

  <button class="fab" id="add" title="Add entry">+</button>

  <div class="scrim" id="bookScrim">
    <form class="sheet" id="bookForm">
      <h2 id="bookTitle">New booking</h2>

      <div class="pair">
        <label>AR<input type="text" id="bAr" readonly></label>
        <label>Pax<input type="number" id="bPax" inputmode="numeric" min="0"></label>
      </div>

      <label>Name<input type="text" id="bName" required autocomplete="off"></label>

      <label>Stay<select id="bStay"></select></label>
      <label class="hide" id="bStayOtherWrap">Stay (type it)
        <input type="text" id="bStayOther" autocomplete="off"></label>

      <div class="pair">
        <label>Check in<input type="date" id="bInDate" required></label>
        <label>Time<select id="bInTime"></select></label>
      </div>
      <label class="hide" id="bInTimeOtherWrap">Check-in time (type it)
        <input type="text" id="bInTimeOther" placeholder="e.g. 10:30 AM"></label>

      <div class="pair">
        <label>Check out<input type="date" id="bOutDate"></label>
        <label>Time<select id="bOutTime"></select></label>
      </div>
      <label class="hide" id="bOutTimeOtherWrap">Check-out time (type it)
        <input type="text" id="bOutTimeOther" placeholder="e.g. 11:00 AM"></label>

      <label>Total Cost<input type="text" id="bTotal" inputmode="decimal"></label>

      <div class="pair">
        <label>DP Date<input type="date" id="bDpDate"></label>
        <label>DP<input type="text" id="bDp" inputmode="decimal"></label>
      </div>
      <div class="pair">
        <label>Mode of Payment<select id="bDpMode"></select></label>
        <label>and<select id="bDpMode2"></select></label>
      </div>

      <label>Full Payment<input type="text" id="bFp" inputmode="decimal"></label>
      <div class="pair">
        <label>Mode of Payment<select id="bFpMode"></select></label>
        <label>and<select id="bFpMode2"></select></label>
      </div>

      <label>Status<select id="bStatus">
        <option value="">Normal</option>
        <option value="CANCELLED">Cancelled</option>
        <option value="REBOOKED">Rebooked</option>
      </select></label>

      <label>Remarks<textarea id="bRemarks"></textarea></label>

      <div class="buttons">
        <button type="button" id="bookCancel">Cancel</button>
        <button type="submit" class="primary" id="bookSave">Add</button>
      </div>
    </form>
  </div>

  <script>
    var PENCIL = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">' +

    var TRASH = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">' +

    // ------------------------------------------------------- peso formatting

    var PESO = '₱';

    function parseAmount(text) {
      var cleaned = String(text == null ? '' : text)
        .replace(new RegExp(PESO, 'g'), '')
        .replace(/,/g, '')
        .trim();
      if (cleaned === '') return null;
      var value = Number(cleaned);
      return isFinite(value) ? value : null;
    }

    function money(value) {
      return PESO + Number(value).toLocaleString('en-US',
        { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Formats mid-typing without forcing decimals the user has not typed yet.
    function moneyWhileTyping(text) {
      var whole = '', fraction = '', afterPoint = false;

      for (var i = 0; i < text.length; i++) {
        var ch = text.charAt(i);
        if (ch >= '0' && ch <= '9') {
          if (!afterPoint) whole += ch;
          else if (fraction.length < 2) fraction += ch;
        } else if (ch === '.' && !afterPoint) {
          afterPoint = true;
        }
      }

      if (whole === '' && !afterPoint) return '';

      var digits = whole.replace(/^0+(?=\d)/, '');
      if (digits === '') digits = '0';

      var grouped = '';
      for (var j = 0; j < digits.length; j++) {
        if (j > 0 && (digits.length - j) % 3 === 0) grouped += ',';
        grouped += digits.charAt(j);
      }

      return PESO + grouped + (afterPoint ? '.' + fraction : '');
    }

    // ------------------------------------------------------- server calls

    // The PIN is remembered on the device so it is asked for once, not every
    // time the app is opened.
    var PIN_KEY = 'cashDisbursementPin';

    function storedPin() {
      try { return localStorage.getItem(PIN_KEY) || ''; } catch (e) { return ''; }
    }

    function rememberPin(pin) {
      try { localStorage.setItem(PIN_KEY, pin); } catch (e) { /* private mode */ }
    }

    function forgetPin() {
      try { localStorage.removeItem(PIN_KEY); } catch (e) { /* private mode */ }
    }

    /** Every server call carries the PIN; the server rejects a bad one. */
    function call(name, args) {
      busy(true);

      // Content-Type text/plain keeps this a "simple" cross-origin request, so
      // the browser skips the CORS preflight that Apps Script cannot answer.
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: name, pin: storedPin(), args: args || [] })
      })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          busy(false);
          if (data.ok) return data.result;

          // A rejected PIN sends the user back to the lock screen rather than
          // leaving every action failing for no visible reason.
          if (/wrong pin/i.test(data.error || '')) {
            forgetPin();
            showLock('That PIN was not right.');
          }
          throw new Error(data.error || 'The request failed.');
        })
        .catch(function (error) {
          busy(false);
          throw error;
        });
    }

    function busy(on) {
      document.getElementById('busy').classList.toggle('on', on);
    }

    var statusTimer = null;
    function say(message, bad) {
      var box = document.getElementById('status');
      if (!box) {
        box = document.createElement('div');
        box.id = 'status';
        box.className = 'status';
        document.body.appendChild(box);
      }
      box.textContent = message;
      box.className = 'status on' + (bad ? ' bad' : '');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(function () { box.className = 'status'; }, bad ? 6000 : 2600);
    }

    function failed(error) {
      say(error && error.message ? error.message : String(error), true);
    }

    // ------------------------------------------------------- rendering

    function renderMonths() {
      var host = document.getElementById('months');
      host.innerHTML = '';

      var months = view === 'book' ? book.months : state.months;
      var current = view === 'book' ? book.month : state.month;

      months.forEach(function (name) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'month' + (name === current ? ' on' : '');
        // The tab prefix is redundant once the Bookings view is selected.
        // "Bookings August 2026" -> "Aug 2026", as on the desktop.
        chip.textContent = shortMonth(name);
        chip.onclick = function () { openMonth(name); };
        host.appendChild(chip);
      });

      var active = host.querySelector('.month.on');
      if (active && active.scrollIntoView) {
        active.scrollIntoView({ inline: 'center', block: 'nearest' });
      }
    }

    function renderList() {
      if (view === 'book') return renderBookings();

      var host = document.getElementById('list');
      host.innerHTML = '';

      if (!state.entries.length) {
        host.innerHTML = '<div class="empty">No entries in ' + escapeHtml(state.month) +
          ' yet.<br>Tap + to add one.</div>';
        return;
      }

      var table = document.createElement('table');
      table.className = 'grid';

      // Widths total 100%, so the grid can never be wider than the screen.
      table.innerHTML =
        '<colgroup>' +
        '<col style="width:6%">' +    // No.
        '<col style="width:12%">' +   // Date
        '<col style="width:18%">' +   // Payee
        '<col style="width:9%">' +    // S.I. - short reference numbers
        '<col style="width:23%">' +   // Amount - widest, holds the peso sign
        '<col style="width:16%">' +   // Type
        '<col style="width:16%">' +   // edit / delete - two 24px buttons
        '</colgroup>' +
        '<thead><tr>' +
        '<th class="mid">No.</th>' +
        '<th class="mid">Date</th>' +
        '<th>Payee</th>' +
        '<th class="mid">S.I.</th>' +
        '<th class="num">Amount</th>' +
        '<th class="mid">Type</th>' +
        '<th></th>' +
        '</tr></thead>';

      var body = document.createElement('tbody');

      state.entries.forEach(function (entry) {
        var tr = document.createElement('tr');

        // title attributes let a clipped cell still be readable on long-press.
        tr.innerHTML =
          '<td class="mid">' + escapeHtml(entry.no) + '</td>' +
          '<td class="mid">' + escapeHtml(entry.dateDisplay) + '</td>' +
          '<td class="payee" title="' + escapeHtml(entry.payee) + '">' +
          escapeHtml(entry.payee) + '</td>' +
          '<td class="mid" title="' + escapeHtml(entry.siNo) + '">' +
          escapeHtml(entry.siNo) + '</td>' +
          '<td class="num">' + money(entry.amount) + '</td>' +
          '<td class="mid" title="' + escapeHtml(entry.type) + '">' +
          escapeHtml(entry.type) + '</td>' +
          '<td class="act">' +
          '<button class="rowbtn edit" title="Edit">' + PENCIL + '</button>' +
          '<button class="rowbtn del" title="Delete">' + TRASH + '</button>' +
          '</td>';

        var cell = tr.lastChild;
        cell.firstChild.onclick = function () { editEntry(entry); };
        cell.lastChild.onclick = function () { deleteEntry(entry, tr); };
        body.appendChild(tr);
      });

      table.appendChild(body);

      var foot = document.createElement('tfoot');
      var rows = '<tr><td colspan="3"></td><td class="num">Total</td>' +
        '<td class="num">' + money(state.total) + '</td><td></td><td></td></tr>';

      if (state.gross !== null && state.gross !== undefined) {
        var net = state.gross - state.total;
        rows += '<tr><td colspan="3"></td><td class="num">Gross</td>' +
          '<td class="num">' + money(state.gross) + '</td><td></td><td></td></tr>' +
          '<tr><td colspan="3"></td><td class="num">Net</td>' +
          '<td class="num"' + (net < 0 ? ' style="color:var(--danger)"' : '') + '>' +
          money(net) + '</td><td></td><td></td></tr>';
      }

      foot.innerHTML = rows;
      table.appendChild(foot);

      host.appendChild(table);
    }

    function escapeHtml(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /** Booking income for the shown month, for the gross and net lines. */
    function loadGross() {
      var parts = String(state.month).split(' ');      // "Sep 2026"
      var index = MONTH_SHORT.indexOf(parts[0]);
      if (index < 0) return;

      call('bookingGross', [Number(parts[1]), index]).then(function (gross) {
        state.gross = gross;
        if (view === 'disb') renderList();
      }).catch(function () { /* a missing figure must not block the list */ });
    }

    function applyLedger(result) {
      if (result.months) state.months = result.months;
      var ledger = result.ledger || result;
      state.month = ledger.sheetName;
      state.entries = ledger.entries;
      state.total = ledger.total;
      state.gross = null;
      renderMonths();
      renderList();
      loadGross();
    }

    var MONTH_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
      'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var MONTH_LONG = ['January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'];

    function shortMonth(name) {
      var text = String(name).replace(/^Bookings /, '');
      var parts = text.split(' ');
      var index = MONTH_LONG.indexOf(parts[0]);
      return index < 0 ? text : MONTH_SHORT[index] + ' ' + (parts[1] || '');
    }

    /**
     * Cancelled beats rebooked beats paid. The first two are read from the
     * remarks, which is where the sheet already records them.
     */
    function bookingState(entry) {
      var remarks = (entry.remarks || '').toLowerCase();
      if (remarks.indexOf('cancel') >= 0) return 'cancelled';
      if (remarks.indexOf('rebook') >= 0) return 'rebooked';

      var owed = Number(String(entry.balanceAfterDp).replace(/[^0-9.\-]/g, ''));
      var paid = Number(entry.fp) || 0;
      var billed = Number(String(entry.discounted).replace(/[^0-9.\-]/g, '')) || Number(entry.totalCost) || 0;

      if (billed > 0 && isFinite(owed) && owed === paid) return 'paid';
      return '';
    }

    function renderBookings() {
      var host = document.getElementById('list');
      host.innerHTML = '';

      if (!book.entries.length) {
        host.innerHTML = '<div class="empty">No bookings in ' +
          escapeHtml(book.month.replace(/^Bookings /, '')) +
          ' yet.<br>Tap + to add one.</div>';
        return;
      }

      var table = document.createElement('table');
      table.className = 'grid';

      // Only six of the fourteen fields fit a phone; the pencil opens the rest.
      table.innerHTML =
        '<colgroup>' +
        '<col style="width:6%">' +    // No.
        '<col style="width:24%">' +   // Name
        '<col style="width:13%">' +   // Check in
        '<col style="width:8%">' +    // Pax
        '<col style="width:17%">' +   // Total
        '<col style="width:16%">' +   // Balance
        '<col style="width:16%">' +   // edit / delete
        '</colgroup>' +
        '<thead><tr>' +
        '<th class="mid">No.</th>' +
        '<th>Name</th>' +
        '<th class="mid">In</th>' +
        '<th class="mid">Pax</th>' +
        '<th class="num">Total</th>' +
        '<th class="num">Balance</th>' +
        '<th></th>' +
        '</tr></thead>';

      var body = document.createElement('tbody');

      book.entries.forEach(function (entry) {
        var tr = document.createElement('tr');
        var state = bookingState(entry);
        if (state) tr.className = state;
        if (entry.remarks) tr.title = entry.remarks;
        tr.innerHTML =
          '<td class="mid">' + escapeHtml(entry.no) + '</td>' +
          '<td class="payee" title="' + escapeHtml(entry.name) + '">' +
          escapeHtml(entry.name) + '</td>' +
          '<td class="mid">' + escapeHtml(entry.inDateDisplay) + '</td>' +
          '<td class="mid">' + escapeHtml(String(entry.pax || '')) + '</td>' +
          '<td class="num">' + escapeHtml(entry.discounted || money(entry.totalCost)) + '</td>' +
          '<td class="num" title="' + escapeHtml(entry.balanceFinal) + '">' +
          escapeHtml(entry.balanceFinal) + '</td>' +
          '<td class="act">' +
          '<button class="rowbtn edit" title="Edit">' + PENCIL + '</button>' +
          '<button class="rowbtn del" title="Delete">' + TRASH + '</button>' +
          '</td>';

        var cell = tr.lastChild;
        cell.firstChild.onclick = function () { openBookForm(entry); };
        cell.lastChild.onclick = function () { deleteBooking(entry, tr); };
        body.appendChild(tr);
      });

      table.appendChild(body);

      var foot = document.createElement('tfoot');
      foot.innerHTML =
        '<tr><td colspan="3"></td><td class="num">Total</td>' +
        '<td class="num">' + money(book.total) + '</td>' +
        '<td></td><td></td></tr>';
      table.appendChild(foot);

      host.appendChild(table);
    }

    function applyBookings(result) {
      if (result.months) book.months = result.months;
      var ledger = result.ledger || result;
      book.month = ledger.sheetName;
      book.entries = ledger.entries;
      book.total = ledger.total;
      renderMonths();
      renderList();
    }

    // ------------------------------------------------------- view switch

    function fillSelect(id, options, withOther) {
      var select = document.getElementById(id);
      select.innerHTML = '';
      options.forEach(function (name) {
        var option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      });
      if (withOther) {
        var other = document.createElement('option');
        other.value = '__other__';
        other.textContent = 'Other...';
        select.appendChild(other);
      }
    }

    /** Shows the free-text box whenever "Other..." is picked. */
    function wireOther(selectId, wrapId) {
      document.getElementById(selectId).onchange = function () {
        document.getElementById(wrapId)
          .classList.toggle('hide', this.value !== '__other__');
      };
    }

    function setSelectOrOther(selectId, wrapId, otherId, value) {
      var select = document.getElementById(selectId);
      var known = [].some.call(select.options, function (o) { return o.value === value; });

      if (value && !known) {
        select.value = '__other__';
        document.getElementById(otherId).value = value;
        document.getElementById(wrapId).classList.remove('hide');
      } else {
        select.value = value || select.options[0].value;
        document.getElementById(otherId).value = '';
        document.getElementById(wrapId).classList.add('hide');
      }
    }

    function readSelectOrOther(selectId, otherId) {
      var value = document.getElementById(selectId).value;
      return value === '__other__'
        ? document.getElementById(otherId).value.trim()
        : value;
    }

    function switchView(next) {
      if (view === next) return;
      view = next;

      document.getElementById('viewDisb').classList.toggle('on', next === 'disb');
      document.getElementById('viewBook').classList.toggle('on', next === 'book');
      document.getElementById('title').textContent =
        next === 'book' ? 'Bookings' : 'Disbursement';

      if (next === 'book' && !book.loaded) {
        call('getBookingBootstrap', []).then(function (data) {
          book.loaded = true;
          book.stayOptions = data.stayOptions;
          book.inTimes = data.inTimes;
          book.outTimes = data.outTimes;
          book.paymentModes = data.paymentModes;

          fillSelect('bStay', data.stayOptions, true);
          fillSelect('bInTime', data.inTimes, true);
          fillSelect('bOutTime', data.outTimes, true);
          fillSelect('bDpMode', [''].concat(data.paymentModes), false);
          fillSelect('bDpMode2', [''].concat(data.paymentModes), false);
          fillSelect('bFpMode', [''].concat(data.paymentModes), false);
          fillSelect('bFpMode2', [''].concat(data.paymentModes), false);

          book.months = data.months;
          book.month = data.selected;
          applyBookings({ months: data.months, ledger: data.ledger });
        }).catch(failed);
        return;
      }

      renderMonths();
      renderList();
    }

    // ------------------------------------------------------- booking form

    function openBookForm(entry) {
      book.editing = entry || null;

      document.getElementById('bookTitle').textContent = entry ? 'Edit booking' : 'New booking';
      document.getElementById('bookSave').textContent = entry ? 'Save' : 'Add';

      // Assigned on save, continuing from the highest in the ledger.
      document.getElementById('bAr').value = entry ? entry.ar : '(auto)';
      document.getElementById('bName').value = entry ? entry.name : '';
      document.getElementById('bPax').value = entry ? (entry.pax || '') : '';
      document.getElementById('bInDate').value = entry ? entry.inDateIso : state.today;
      document.getElementById('bOutDate').value = entry ? entry.outDateIso : '';
      document.getElementById('bTotal').value = entry ? money(entry.totalCost) : '';
      document.getElementById('bDpDate').value = entry ? entry.dpDateIso : '';
      document.getElementById('bDp').value = entry && entry.dp ? money(entry.dp) : '';
      document.getElementById('bFp').value = entry && entry.fp ? money(entry.fp) : '';
      document.getElementById('bRemarks').value = entry ? entry.remarks : '';

      setSelectOrOther('bStay', 'bStayOtherWrap', 'bStayOther', entry ? entry.stay : '');
      setSelectOrOther('bInTime', 'bInTimeOtherWrap', 'bInTimeOther', entry ? entry.inTime : '');
      setSelectOrOther('bOutTime', 'bOutTimeOtherWrap', 'bOutTimeOther', entry ? entry.outTime : '');
      splitModes(entry ? entry.dpMode : '', 'bDpMode', 'bDpMode2');
      splitModes(entry ? entry.fpMode : '', 'bFpMode', 'bFpMode2');

      var state = entry ? bookingState(entry) : '';
      document.getElementById('bStatus').value =
        state === 'cancelled' ? 'CANCELLED' : state === 'rebooked' ? 'REBOOKED' : '';

      document.getElementById('bookScrim').classList.add('on');
    }

    /** Two dropdowns into one cell: "BPI + Cash". */
    function combineModes(firstId, secondId) {
      var a = document.getElementById(firstId).value;
      var b = document.getElementById(secondId).value;
      if (!a) return b;
      if (!b || a === b) return a;
      return a + ' + ' + b;
    }

    function splitModes(value, firstId, secondId) {
      var parts = String(value || '').split('+').map(function (p) { return p.trim(); })
        .filter(function (p) { return p.length > 0; });
      setOption(firstId, parts[0] || '');
      setOption(secondId, parts[1] || '');
    }

    /** Keeps a value the sheet holds even when it is not one of the standard modes. */
    function setOption(id, value) {
      var select = document.getElementById(id);
      var known = [].some.call(select.options, function (o) { return o.value === value; });
      if (value && !known) {
        var option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      }
      select.value = value;
    }

    function closeBookForm() {
      document.getElementById('bookScrim').classList.remove('on');
      book.editing = null;
    }

    function submitBookForm(event) {
      event.preventDefault();

      var name = document.getElementById('bName').value.trim();
      if (!name) { say('Enter a name.', true); return; }

      var inDate = document.getElementById('bInDate').value;
      if (!inDate) { say('Enter a check-in date.', true); return; }

      function amount(id) {
        var raw = document.getElementById(id).value.trim();
        if (!raw) return '';
        var value = parseAmount(raw);
        return value === null ? '' : value;
      }

      var payload = {
        ar: document.getElementById('bAr').value.trim(),
        name: name,
        stay: readSelectOrOther('bStay', 'bStayOther'),
        remarks: document.getElementById('bRemarks').value.trim(),
        pax: document.getElementById('bPax').value.trim(),
        inDate: inDate,
        inTime: readSelectOrOther('bInTime', 'bInTimeOther'),
        outDate: document.getElementById('bOutDate').value,
        outTime: readSelectOrOther('bOutTime', 'bOutTimeOther'),
        totalCost: amount('bTotal'),
        dpDate: document.getElementById('bDpDate').value,
        dp: amount('bDp'),
        dpMode: combineModes('bDpMode', 'bDpMode2'),
        fp: amount('bFp'),
        fpMode: combineModes('bFpMode', 'bFpMode2')
      };

      var editing = book.editing;
      var work = editing
        ? call('updateBooking', [editing.sheetName || book.month, editing.sheetRow, payload])
        : call('addBooking', [payload]);

      var status = document.getElementById('bStatus').value;

      work.then(function (result) {
        // The marker lives in the remarks, so it is applied after the row is
        // written rather than being part of the same payload.
        var target = (result.ledger.entries || []).filter(function (e) {
          return e.name === payload.name && e.inDateIso === payload.inDate;
        })[0];

        if (target && bookingState(target) !== (status ? status.toLowerCase() : '')) {
          return call('markBooking', [result.ledger.sheetName, target.sheetRow, status || null])
            .then(function (marked) {
              closeBookForm();
              applyBookings(marked);
              say(editing ? 'Saved.' : 'Added, AR ' + (result.ar || ''));
            });
        }

        closeBookForm();
        applyBookings(result);
        say(editing ? 'Saved.' : 'Added, AR ' + (result.ar || ''));
      }).catch(failed);
    }

    function deleteBooking(entry, tr) {
      if (!confirm('Delete No. ' + entry.no + ' - ' + entry.name + '?\n\n' +
        'The bookings below it move up and are renumbered.')) return;

      tr.className = 'busy';
      call('deleteBookings', [book.month, [entry.sheetRow]]).then(function (result) {
        applyBookings(result);
        say('Deleted.');
      }).catch(function (error) { tr.className = ''; failed(error); });
    }

    // ------------------------------------------------------- actions

    function openMonth(name) {
      if (view === 'book') {
        book.month = name;
        renderMonths();
        call('getBookings', [name]).then(applyBookings).catch(failed);
        return;
      }

      state.month = name;
      renderMonths();
      call('getEntries', [name]).then(applyLedger).catch(failed);
    }

    function openForm(entry) {
      state.editing = entry || null;

      document.getElementById('formTitle').textContent = entry ? 'Edit entry' : 'New entry';
      document.getElementById('formSave').textContent = entry ? 'Save' : 'Add';

      document.getElementById('fDate').value = entry ? entry.dateIso : state.today;
      document.getElementById('fPayee').value = entry ? entry.payee : '';
      document.getElementById('fParticular').value = entry ? entry.particular : '';
      document.getElementById('fSiNo').value = entry ? entry.siNo : '';
      document.getElementById('fAmount').value = entry ? money(entry.amount) : '';

      var type = document.getElementById('fType');
      type.value = entry && entry.type ? entry.type : state.categories[0];

      document.getElementById('scrim').classList.add('on');
    }

    function closeForm() {
      document.getElementById('scrim').classList.remove('on');
      state.editing = null;
    }

    function submitForm(event) {
      event.preventDefault();

      var amount = parseAmount(document.getElementById('fAmount').value);
      if (amount === null) { say('The amount is not a number.', true); return; }

      var payee = document.getElementById('fPayee').value.trim();
      if (!payee) { say('Enter a payee.', true); return; }

      var payload = {
        date: document.getElementById('fDate').value,
        payee: payee,
        particular: document.getElementById('fParticular').value.trim(),
        siNo: document.getElementById('fSiNo').value.trim(),
        amount: amount,
        type: document.getElementById('fType').value
      };

      var editing = state.editing;
      var work = editing
        ? call('updateEntry', [editing.sheetName || state.month, editing.sheetRow, payload])
        : call('addEntry', [payload]);

      work.then(function (result) {
        closeForm();
        applyLedger(result);
        say(editing ? 'Saved.' : 'Added to ' + result.ledger.sheetName + '.');
      }).catch(failed);
    }

    function editEntry(entry) {
      entry.sheetName = state.month;
      openForm(entry);
    }

    function deleteEntry(entry, tr) {
      if (!confirm('Delete No. ' + entry.no + ' - ' + entry.payee + ' - ' +
        money(entry.amount) + '?\n\nThe entries below it move up and are renumbered.')) return;

      tr.className = 'busy';
      call('deleteEntries', [state.month, [entry.sheetRow]]).then(function (result) {
        applyLedger(result);
        say('Deleted.');
      }).catch(function (error) {
        tr.className = '';
        failed(error);
      });
    }

    // ------------------------------------------------------- wiring

    document.getElementById('add').onclick = function () {
      if (view === 'book') openBookForm(null);
      else openForm(null);
    };

    document.getElementById('viewDisb').onclick = function () { switchView('disb'); };
    document.getElementById('viewBook').onclick = function () { switchView('book'); };
    document.getElementById('bookCancel').onclick = closeBookForm;
    document.getElementById('bookForm').onsubmit = submitBookForm;
    document.getElementById('bookScrim').onclick = function (event) {
      if (event.target.id === 'bookScrim') closeBookForm();
    };

    wireOther('bStay', 'bStayOtherWrap');
    wireOther('bInTime', 'bInTimeOtherWrap');
    wireOther('bOutTime', 'bOutTimeOtherWrap');

    ['bTotal', 'bDp', 'bFp'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', function () {
        var caret = this.selectionStart;
        var before = this.value;
        var digitsRight = 0;
        for (var i = caret; i < before.length; i++) {
          if (before.charAt(i) >= '0' && before.charAt(i) <= '9') digitsRight++;
        }
        var after = moneyWhileTyping(before);
        if (after === before) return;
        this.value = after;
        var index = after.length, seen = 0;
        while (index > 0 && seen < digitsRight) {
          index--;
          if (after.charAt(index) >= '0' && after.charAt(index) <= '9') seen++;
        }
        this.setSelectionRange(index, index);
      });
    });
    document.getElementById('formCancel').onclick = closeForm;
    document.getElementById('form').onsubmit = submitForm;
    document.getElementById('scrim').onclick = function (event) {
      if (event.target.id === 'scrim') closeForm();
    };

    // Live peso formatting, keeping the caret in the same place among the digits.
    document.getElementById('fAmount').addEventListener('input', function () {
      var box = this;
      var before = box.value;
      var caret = box.selectionStart;

      var digitsRight = 0;
      for (var i = caret; i < before.length; i++) {
        if (before.charAt(i) >= '0' && before.charAt(i) <= '9') digitsRight++;
      }

      var after = moneyWhileTyping(before);
      if (after === before) return;
      box.value = after;

      var index = after.length, seen = 0;
      while (index > 0 && seen < digitsRight) {
        index--;
        if (after.charAt(index) >= '0' && after.charAt(index) <= '9') seen++;
      }
      box.setSelectionRange(index, index);
    });

    /**
     * position:fixed anchors to the layout viewport, which pinch-zooming moves
     * out from under the screen. visualViewport is what is actually visible, so
     * the button is placed against that and scaled back to a constant size.
     */
    function pinAddButton() {
      var vv = window.visualViewport;
      if (!vv) return;

      var fab = document.getElementById('add');
      var scale = vv.scale || 1;
      var size = 50 / scale;
      var margin = 16 / scale;

      fab.style.right = 'auto';
      fab.style.bottom = 'auto';
      fab.style.left = (vv.offsetLeft + vv.width - size - margin) + 'px';
      fab.style.top = (vv.offsetTop + vv.height - size - margin) + 'px';
      fab.style.transformOrigin = 'top left';
      fab.style.transform = 'scale(' + (1 / scale) + ')';
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', pinAddButton);
      window.visualViewport.addEventListener('scroll', pinAddButton);
      window.addEventListener('scroll', pinAddButton);
      pinAddButton();
    }

    // ------------------------------------------------------- lock screen

    function showLock(message) {
      document.getElementById('lockError').textContent = message || '';
      document.getElementById('lock').classList.remove('off');
      document.getElementById('pin').value = '';
      setTimeout(function () { document.getElementById('pin').focus(); }, 50);
    }

    function hideLock() {
      document.getElementById('lock').classList.add('off');
    }

    document.getElementById('lockForm').onsubmit = function (event) {
      event.preventDefault();
      var pin = document.getElementById('pin').value.trim();
      if (!pin) return;

      rememberPin(pin);
      document.getElementById('lockError').textContent = '';
      start();
    };

    // ------------------------------------------------------- start

    function start() {
      if (!storedPin()) { showLock(''); return; }

      call('getBootstrap', []).then(function (data) {
        state.today = data.today;
        state.categories = data.categories;

        var type = document.getElementById('fType');
        type.innerHTML = '';
        data.categories.forEach(function (name) {
          var option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          type.appendChild(option);
        });

        state.months = data.months;
        state.month = data.selected;
        applyLedger({ months: data.months, ledger: data.ledger });
        hideLock();
      }).catch(function (error) {
        // showLock has already been raised for a bad PIN by the failure handler.
        if (!/wrong pin/i.test((error && error.message) || '')) failed(error);
      });
    }

    start();
  </script>
</body>

</html>
